services:
  postgres:
    build: ./postgres
    container_name: flask-ec-postgres
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      POSTGRES_DB: ecdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - flask-ec-network

  web:
    build: .
    container_name: flask-ec-app
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      - FLASK_ENV=development
      - SECRET_KEY=dev-secret-key-for-local
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/ecdb
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY:-your-license-key-here}
      - NEW_RELIC_USER_KEY=${NEW_RELIC_USER_KEY:-your-user-key-here}
      - NEW_RELIC_ENVIRONMENT=development
      - NEW_RELIC_APP_NAME=Flask-EC-App-Local
      - BULK_USER_DEFAULT_PASSWORD=TestPass123
      - LOAD_TESTER_URL=http://load-tester:8080
    ports:
      - "5001:5000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - flask-ec-network

  distributed-service:
    build: ./distributed-service
    container_name: flask-ec-distributed-service
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/ecdb
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY:-your-license-key-here}
      - NEW_RELIC_APP_NAME=Flask-EC-Distributed-Service
      - NEW_RELIC_ENVIRONMENT=development
    ports:
      - "5002:5000"
    volumes:
      - ./distributed-service:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - flask-ec-network

  load-tester:
    build: ./load-tester
    container_name: flask-ec-load-tester
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      - LOAD_TESTER_TARGET_APP_URL=http://web:5000
      - LOAD_TESTER_LOG_LEVEL=DEBUG
    ports:
      - "8080:8080"
    volumes:
      - ./logs:/app/logs
      - load-test-data:/app/data
    depends_on:
      - web
    networks:
      - flask-ec-network

  newrelic-infra:
    image: newrelic/infrastructure-bundle:latest
    container_name: flask-ec-newrelic-infra
    # ホストのCPU/メモリ/プロセス/ディスクメトリクスを取得するために必要
    privileged: true
    pid: host
    # ホスト(VM)のcgroup名前空間を共有し、nri-dockerが各コンテナのcgroup実値を読めるようにする
    cgroup: host
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      - NRIA_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY}
      - NRIA_DISPLAY_NAME=Flask-EC-Infrastructure
      # HOST_ROOT を空にして、cgroup を素の標準パス(/sys/fs/cgroup)から検出させる
      - NRIA_OVERRIDE_HOST_ROOT=
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DATABASE=ecdb
    volumes:
      - ./newrelic/newrelic-infra.yml:/etc/newrelic-infra.yml:ro
      - ./newrelic/postgresql-config.yml:/etc/newrelic-infra/integrations.d/postgresql-config.yml:ro
      # コンテナ版 Infra エージェントの公式推奨マウント
      # SystemSample(ホストメトリクス) と ContainerSample(nri-docker) の両方に必要
      - "/:/host:ro"
      - "/sys:/sys:ro"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - flask-ec-network

  browser-tester:
    build: ./browser-tester
    container_name: flask-ec-browser-tester
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      - TARGET_APP_URL=http://web:5000
      - PAGE_WAIT_SECONDS=3
      - BROWSER_WIDTH=1920
      - BROWSER_HEIGHT=1080
      - RETRY_COUNT=1
      - LOG_LEVEL=INFO
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY:-your-license-key-here}
    ports:
      - "8081:8081"
    volumes:
      - browser-test-data:/app/data
    depends_on:
      - web
    networks:
      - flask-ec-network
    shm_size: '2gb'

networks:
  flask-ec-network:
    driver: bridge

volumes:
  postgres_data:
  load-test-data:
  browser-test-data:
